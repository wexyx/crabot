[workspace]
members = ["crates/agent-node", "crates/agent-protocol", "crates/agent-runtime", "crates/agent-tool-macros"]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
# Linux releases use the system OpenSSL 3 provided by Debian 12+.
reqwest = { version = "0.12", features = ["native-tls", "json", "stream"] }
