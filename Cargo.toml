

[package]
name = "crabot"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "ai",
    "common",
    "derive",
    "crates/domain",
    "crates/runtime",
    "crates/skills",
    "crates/plugins",
    "crates/mcp",
    "crates/storage",
    "crates/api",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.108"
anyhow = "1.0.102"
fast_log = "1.6"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
inventory = "0.3"
futures = "0.3.32"
uuid = { version = "1.0", features = ["v4", "serde"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
fast_log.workspace = true
log.workspace = true
env_logger.workspace = true
chrono.workspace = true
async-trait.workspace = true
uuid.workspace = true

ai = { path = "./ai" }
crabot-domain = { path = "./crates/domain" }
crabot-runtime = { path = "./crates/runtime" }
crabot-skills = { path = "./crates/skills" }
crabot-plugins = { path = "./crates/plugins" }
crabot-mcp = { path = "./crates/mcp" }

rbs = { version = "4"}
rbatis = { version = "4.7"}
rbdc-mysql = { version = "4.7" }

