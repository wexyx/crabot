[workspace]
members = ["crates/agent-node", "crates/agent-protocol", "crates/agent-runtime", "crates/agent-tool-macros"]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
# Keep native TLS; Linux builds embed OpenSSL instead of requiring libssl.so.
reqwest = { version = "0.12", features = ["native-tls-vendored", "json", "stream"] }
