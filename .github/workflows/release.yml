name: Release Crabot
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    env:
      CRABOT_RELEASE_VERSION: ${{ github.ref_name }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64
            cc: gcc
            cxx: g++
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64
            cc: gcc
            cxx: g++
          - os: macos-15
            target: aarch64-apple-darwin
            cc: clang
            cxx: clang++
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin LadybugDB prebuilt version to Cargo.lock
        shell: bash
        run: |
          lbug_version=$(awk '
            $0 == "name = \"lbug\"" {found=1; next}
            found && $1 == "version" {gsub(/\"/, "", $3); print $3; exit}
          ' Cargo.lock)
          [[ $lbug_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Cannot resolve lbug version from Cargo.lock.' >&2; exit 1; }
          echo "LBUG_VERSION=$lbug_version" >> "$GITHUB_ENV"
      - name: Select macOS C++20 toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          # Preserve the previous ARM build's deployment target on the newer SDK.
          echo 'MACOSX_DEPLOYMENT_TARGET=14.5' >> "$GITHUB_ENV"
      - name: Verify C++20 standard library
        if: runner.os == 'macOS'
        run: |
          "$CXX" --version
          "$CXX" -std=c++20 scripts/ci/cxx20-probe.cpp -o "$RUNNER_TEMP/crabot-cxx20-probe"
          "$RUNNER_TEMP/crabot-cxx20-probe"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/linux-libraries.test.mjs
      - run: npm install --global pnpm@10
      - if: runner.os == 'macOS'
        run: rustup update stable --no-self-update
      - run: pnpm install --frozen-lockfile && pnpm web:build
      - name: Build Linux release on glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e CRABOT_RELEASE_VERSION -e LBUG_VERSION \
            '${{ matrix.image }}' bash scripts/ci/build-linux-release.sh '${{ matrix.target }}'
      - name: Verify Linux package on Debian 10
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none -v "$PWD/dist:/dist:ro" \
            -e CRABOT_RELEASE_VERSION debian:buster-slim \
            bash -eu -c '
              tar -xzf "/dist/crabot-${{ matrix.target }}.tar.gz" -C /tmp
              test "$(/tmp/crabot/bin/crabot --version)" = "Crabot $CRABOT_RELEASE_VERSION"
              ldd /tmp/crabot/libexec/agent-node
              dependencies=$(ldd /tmp/crabot/lib/lbug/fts/libfts.lbug_extension)
              printf "%s\n" "$dependencies"
              ! printf "%s\n" "$dependencies" | grep -E "not found|lib(ssl|crypto)\.so"
            '
      - if: runner.os == 'macOS'
        run: cargo +stable build --release --locked -p agent-node
      - name: Verify embedded release version
        if: runner.os == 'macOS'
        run: test "$(target/release/agent-node --version)" = "Crabot $CRABOT_RELEASE_VERSION"
      - if: runner.os == 'macOS'
        run: bash scripts/package-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: crabot-${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --title "Crabot $RELEASE_TAG" --generate-notes
