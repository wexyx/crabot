[package]
license.workspace = true
name = "agent-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tempfile = "3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
agent-tool-macros = { path = "../agent-tool-macros" }
inventory = "0.3"
shlex = "2.0.1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
agent-protocol = { path = "../agent-protocol" }

[dev-dependencies]
syn = { version = "2", features = ["full"] }
